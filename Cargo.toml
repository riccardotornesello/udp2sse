[package]
name = "udp2sse"
version = "1.0.0"
edition = "2021"
authors = ["Riccardo Tornesello"]
description = "A lightweight bridge between UDP streams and Server-Sent Events (SSE)"
license = "MIT"
repository = "https://github.com/riccardotornesello/udp2sse"
homepage = "https://github.com/riccardotornesello/udp2sse"
documentation = "https://github.com/riccardotornesello/udp2sse#readme"
keywords = ["udp", "sse", "server-sent-events", "streaming", "realtime"]
categories = ["network-programming", "web-programming"]
readme = "README.md"

[dependencies]
actix-web = "4.3.1"
actix-web-lab = "0.19.1"
base64 = "0.21.2"
futures-util = "0.3.28"
